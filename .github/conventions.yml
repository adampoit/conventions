conventions:
  - path: Faithlife/CodingGuidelines/conventions/editorconfig-root
  - path: Faithlife/CodingGuidelines/conventions/editorconfig-json
  - path: Faithlife/CodingGuidelines/conventions/editorconfig-md
  - path: Faithlife/CodingGuidelines/conventions/editorconfig-yaml
  - path: ../gitattributes
  - path: ../prettier-config
  - path: ../renovate
    settings:
      managers:
        - github-actions
      customManagers:
        - customType: regex
          managerFilePatterns:
            - /^repo-conventions-workflow\/convention\.ps1$/
          matchStrings:
            - "(?<depName>actions/checkout)@(?<currentValue>[^'\\s]+)"
            - "(?<depName>actions/setup-dotnet)@(?<currentValue>[^'\\s]+)"
          datasourceTemplate: github-tags
  - path: ../repo-conventions-workflow
  - path: ../license-mit
    settings:
      enabled: true
      copyright-holder: Adam Poit

pull-request:
  labels:
    - automation
